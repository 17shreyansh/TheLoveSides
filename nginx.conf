# Nginx configuration for TheLoveSides
# Server IP: 72.62.228.134
# API Port: 1001 -> Proxies to internal Node.js port (e.g., 4000)
# Storefront Port: 1002 -> Serves static files
# Admin Port: 1003 -> Serves static files

# ==========================================
# API Server (Reverse Proxy)
# ==========================================
server {
    listen 1001;
    server_name 72.62.228.134 _; # The underscore catches any requests to this port if domain isn't matched

    # Important: The Node.js API must run on a different internal port (e.g., 4000). 
    # Change PORT=4000 in your .env file so Nginx can listen on 1001.
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# Storefront Server (Static Files)
# ==========================================
server {
    listen 1002;
    server_name 72.62.228.134 _;

    root /var/www/TheLoveSides/apps/storefront/dist;
    index index.html;

    # Support for React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ==========================================
# Admin Server (Static Files)
# ==========================================
server {
    listen 1003;
    server_name 72.62.228.134 _;

    root /var/www/TheLoveSides/apps/admin/dist;
    index index.html;

    # Support for React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
