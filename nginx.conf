# Nginx configuration for TheLoveSides
# Server IP: 72.62.228.134
# API Port: 1001 -> Proxies to internal Node.js port (e.g., 4000)
# Storefront Port: 1002 -> Serves static files
# Admin Port: 1003 -> Serves static files

# ==========================================
# API Server (Reverse Proxy)
# ==========================================


# ==========================================
# Storefront Server (Static Files)
# ==========================================
server {
    listen 1002;
    server_name 72.62.228.134 _;

    root /var/www/TheLoveSides/apps/storefront/dist;
    index index.html;

    # Support for React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ==========================================
# Admin Server (Static Files)
# ==========================================
server {
    listen 1003;
    server_name 72.62.228.134 _;

    root /var/www/TheLoveSides/apps/admin/dist;
    index index.html;

    # Support for React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
